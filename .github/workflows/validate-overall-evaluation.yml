name: Validate BOAT MOTOR LAB overall evaluation preview

on:
  push:
    branches:
      - overall-evaluation-preview
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check Supabase Edge Function types
        run: deno check supabase/functions/analyze-race-motors/index.ts supabase/functions/analyze-race-motors/course-profile.ts
      - name: Run course profile unit tests
        run: deno test supabase/functions/analyze-race-motors/course-profile_test.ts
      - name: Check browser JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          let cursor = 0;
          let count = 0;
          while ((cursor = html.indexOf('<script', cursor)) !== -1) {
            const start = html.indexOf('>', cursor) + 1;
            const end = html.indexOf('</script>', start);
            if (start === 0 || end === -1) throw new Error('Malformed script tag');
            new Function(html.slice(start, end));
            count++;
            console.log('Script ' + count + ': syntax OK');
            cursor = end + 9;
          }
          if (!count) throw new Error('No script tags found');
          NODE
